[package]
name = "model-gateway"
version = "0.14.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
description = "A local OpenAI-compatible model gateway"
readme = "README.md"
repository = "https://github.com/0xPlayerOne/model-gateway"

[lib]
name = "model_gateway"
path = "src/lib.rs"

[[bin]]
name = "model-gateway"
path = "src/main.rs"

[dependencies]
axum = "0.8"
async-stream = "0.3"
bytes = "1"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.12"
futures-util = "0.3"
getrandom = "0.4"
httpdate = "1"
keyring = "4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "stream"] }
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cc = "1.2.27"
