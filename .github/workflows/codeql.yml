name: CodeQL

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [staging]
  schedule:
    - cron: '31 6 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect
    runs-on: ubuntu-slim
    outputs:
      languages: ${{ steps.languages.outputs.languages }}
      code_security: ${{ steps.security.outputs.status }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          # Detection only reads Git trees, paths, and small profile files;
          # defer source blob transfer until the analyzer jobs.
          filter: blob:none
      - id: languages
        name: Detect languages
        env:
          CODEQL_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bash .github/scripts/codeql-languages.sh
      - name: Detect Code Security
        id: security
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="disabled"
          if [ "${{ github.event.repository.private }}" != "true" ]; then
            status="enabled"
          else
            status="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.security_and_analysis.code_security.status // "disabled"' 2>/dev/null || printf 'disabled')"
          fi
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.name }})
    needs: detect
    if: ${{ !github.event.repository.private || needs.detect.outputs.code_security == 'enabled' }}
    # Unchanged matrix entries only complete skipped steps; reserve a full
    # runner for analyzers that actually initialize and scan source.
    runs-on: ${{ matrix.changed && 'ubuntu-latest' || 'ubuntu-slim' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.languages) }}
    steps:
      - name: Checkout
        if: matrix.changed
        uses: actions/checkout@v7
      - name: Initialize
        if: matrix.changed
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Analyze
        if: matrix.changed
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          # SARIF results remain uploaded for code scanning; the database
          # archive is not needed by this reusable baseline and adds upload
          # overhead.
          upload-database: false
          # The upload acknowledgment is sufficient for the required workflow
          # check; let GitHub process the SARIF asynchronously to remove the
          # post-upload wait from the critical path.
          wait-for-processing: false
