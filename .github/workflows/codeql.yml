name: CodeQL

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [staging, main]
  schedule:
    - cron: '31 6 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    uses: 0xPlayerOne/code-foundry/.github/workflows/codeql.yml@v0.27.0
    with:
      runtime-repository: 0xPlayerOne/code-foundry
      runtime-ref: v0.27.0
      runner: ubuntu-latest
    secrets: inherit
