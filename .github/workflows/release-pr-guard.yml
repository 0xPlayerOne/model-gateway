name: Release PR Guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generated-body:
    name: Generated Release Body
    if: >-
      startsWith(github.event.pull_request.title, 'chore(main): release ') &&
      startsWith(github.event.pull_request.head.ref, 'release-please--branches--main')
    runs-on: ubuntu-slim
    env:
      RELEASE_PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: Require the Release Please body marker
        run: |
          set -euo pipefail
          if ! printf '%s' "$RELEASE_PR_BODY" | grep -Fq 'This PR was generated with [Release Please]'; then
            echo 'The generated Release Please body marker is missing.' >&2
            echo 'Restore the generated body instead of replacing it with manual release notes.' >&2
            exit 1
          fi
          if ! printf '%s' "$RELEASE_PR_BODY" | grep -Eq '^## \[[0-9]+\.[0-9]+\.[0-9]+'; then
            echo 'The generated Release Please version section is missing.' >&2
            exit 1
          fi
