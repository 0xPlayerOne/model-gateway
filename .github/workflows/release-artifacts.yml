name: Release Artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release-tag:
        description: Published GitHub release tag to package (for example, v0.15.0).
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: model-gateway-release-artifacts-${{ github.event.release.tag_name || inputs['release-tag'] }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs['release-tag'] }}

jobs:
  validate-release:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be an exact semantic version such as v0.15.0: $RELEASE_TAG" >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName \
            --jq '.tagName' | grep -Fx "$RELEASE_TAG"

  native:
    name: Native (${{ matrix.name }})
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-latest
            asset: linux-x86_64
          - name: macOS Intel
            runner: macos-15-intel
            asset: macos-x86_64
          - name: macOS ARM
            runner: macos-14
            asset: macos-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Install repository Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --no-self-update

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package and smoke test archive
        env:
          ASSET_NAME: model-gateway-${{ env.RELEASE_TAG }}-${{ matrix.asset }}
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/release-assets"
          package_dir="$RUNNER_TEMP/$ASSET_NAME"
          mkdir -p "$output_dir" "$package_dir"
          install -m 0755 target/release/model-gateway "$package_dir/model-gateway"
          cp gateway.example.toml gateway.core.example.toml \
            gateway.secondary.example.toml gateway.optional.example.toml "$package_dir/"
          cp README.md LICENSE NOTICE "$package_dir/"
          archive="$output_dir/$ASSET_NAME.tar.gz"
          tar -czf "$archive" -C "$package_dir" .
          if command -v sha256sum >/dev/null 2>&1; then
            (cd "$output_dir" && sha256sum "$(basename "$archive")") > "$archive.sha256"
          else
            (cd "$output_dir" && shasum -a 256 "$(basename "$archive")") > "$archive.sha256"
          fi
          RELEASE_SMOKE_EXECUTE_ARCHIVES=1 scripts/release-smoke.sh "$output_dir"

      - name: Upload native archive and checksum
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/release-assets/model-gateway-${RELEASE_TAG}-${{ matrix.asset }}.tar.gz" \
            "$RUNNER_TEMP/release-assets/model-gateway-${RELEASE_TAG}-${{ matrix.asset }}.tar.gz.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  container:
    name: Container image
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish multi-architecture image
        run: |
          set -euo pipefail
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_TAG"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "$image_name" \
            --push \
            .

      - name: Smoke test published image
        run: |
          set -euo pipefail
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_TAG"
          docker pull "$image_name"
          RELEASE_SMOKE_EXECUTE_ARCHIVES=0 scripts/release-smoke.sh /dev/null "$image_name"
