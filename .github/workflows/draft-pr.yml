name: Draft PR

on:
  push:
    branches:
      - 'feat/*'
      - 'fix/*'
      - 'chore/*'
      - 'refactor/*'
      - 'docs/*'
      - 'style/*'
      - 'test/*'

permissions:
  contents: read
  pull-requests: write

jobs:
  draft-pr:
    name: Draft PR
    uses: 0xPlayerOne/code-foundry/.github/workflows/draft-pr.yml@v0.25.0
    with:
      runner: ubuntu-slim
    secrets: inherit
