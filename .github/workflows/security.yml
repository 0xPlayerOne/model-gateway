name: Security

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

env:
  REPO_FOUNDRY_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || '' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    name: Profile
    runs-on: ubuntu-slim
    outputs:
      javascript: ${{ steps.profile.outputs.javascript }}
      rust: ${{ steps.profile.outputs.rust }}
      python: ${{ steps.profile.outputs.python }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            .github
            .npmrc
            .pnpmfile.cjs
            .yarnrc*
            **/package.json
            **/bun.lock
            **/bun.lockb
            **/pnpm-lock.yaml
            **/yarn.lock
            **/package-lock.json
            **/Cargo.toml
            **/Cargo.lock
            **/.cargo/**
            **/pyproject.toml
            **/requirements*.txt
            **/setup.py
            **/setup.cfg
            **/Pipfile
            **/Pipfile.lock
            **/poetry.lock
            **/uv.lock
          sparse-checkout-cone-mode: false
      - name: Detect
        id: profile
        run: bash .github/scripts/security.sh profile >> "$GITHUB_OUTPUT"

  dependency-audit-javascript:
    name: Dependency Audit (JavaScript)
    needs: profile
    if: needs.profile.outputs.javascript == 'true'
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # JavaScript audits only need manifests, lockfiles, and audit config.
          filter: blob:none
          sparse-checkout: |
            .github
            .npmrc
            .pnpmfile.cjs
            .yarnrc*
            **/package.json
            **/bun.lock
            **/bun.lockb
            **/pnpm-lock.yaml
            **/yarn.lock
            **/package-lock.json
          sparse-checkout-cone-mode: false
      - name: Setup
        uses: ./.github/actions/setup
        with:
          mise-scope: javascript
      - name: Audit dependencies
        run: bash .github/scripts/security.sh audit javascript

  dependency-audit-rust:
    name: Dependency Audit (Rust)
    needs: profile
    if: needs.profile.outputs.rust == 'true'
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Rust audits only need manifests, Cargo configuration, and audit config.
          filter: blob:none
          sparse-checkout: |
            .github
            **/Cargo.toml
            **/Cargo.lock
            **/.cargo/**
          sparse-checkout-cone-mode: false
      - name: Setup
        uses: ./.github/actions/setup
        with:
          mise-scope: rust
      - name: Audit dependencies
        run: bash .github/scripts/security.sh audit rust

  dependency-audit-python:
    name: Dependency Audit (Python)
    needs: profile
    if: needs.profile.outputs.python == 'true'
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Python audits only need manifests, lockfiles, and audit config.
          filter: blob:none
          sparse-checkout: |
            .github
            **/pyproject.toml
            **/requirements*.txt
            **/setup.py
            **/setup.cfg
            **/Pipfile
            **/Pipfile.lock
            **/poetry.lock
            **/uv.lock
          sparse-checkout-cone-mode: false
      - name: Setup
        uses: ./.github/actions/setup
        with:
          mise-scope: python
      - name: Audit dependencies
        run: bash .github/scripts/security.sh audit python

  dependency-review:
    name: Dependency Review
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-slim
    steps:
      - name: Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          license-check: true
