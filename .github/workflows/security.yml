name: Code Foundry

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Security
    uses: 0xPlayerOne/code-foundry/.github/workflows/security.yml@v0.27.11
    with:
      runtime-repository: 0xPlayerOne/code-foundry
      runtime-ref: v0.27.11
      runner: ubuntu-slim
    secrets: inherit
