version: 1
profile: application
languages: rust
features: all
package_manager: none
runtime_repository: 0xPlayerOne/code-foundry
runtime_ref: v1.0.3
runner: ubuntu-latest
unit_runner: ubuntu-latest
ci_runner: ubuntu-latest
test_runner: ubuntu-latest
security_runner: ubuntu-slim
codeql_runner: ubuntu-latest
pr_runner: ubuntu-slim
release_runner: ubuntu-slim
prune_standard: false
cache_packages: auto
cache_build: auto
coverage_minimum: 80
turbo_remote: auto
release_type: rust
npm_publish: false
license: agpl-3.0-or-later
git_workflow: direct
merge_strategy: rebase
codeql: auto
dependency_review: auto
toolchain: auto
post_release: false
post_release_workflow:
post_release_mode: auto
opencode_security: true
sync_mode: overlay
custom_workflows: preserve
codeql_rust_shards: '["all"]'
codeql_rust_threads: 1
codeql_rust_max_parallel: 1
release_merge_strategy: rebase
opencode_security_model:
staging_validation_mode: fast
